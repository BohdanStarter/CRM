{% extends "base_menu.html" %}
{% load crispy_forms_tags %}

{% block content %}

<div class="container mt-4">
  <div class="card shadow-sm p-4">
    <div id="status_warning_alert" class="alert alert-danger d-flex align-items-center d-none mb-4" role="alert">
      <svg class="bi flex-shrink-0 me-2" width="24" height="24" role="img" aria-label="Danger:"><use xlink:href="#exclamation-triangle-fill"/></svg>
      <div>
        <strong>Warning:</strong> You are about to deactivate this license. The license will no longer be available for use. Please leave the reason in the <strong>Note</strong> field.
      </div>
    </div>

    <form action="" method="post" id="upload_form" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        {{ form|crispy }}
      </div>

      <div class="d-flex gap-2 justify-content-start mt-3">
        <button type="submit" class="btn btn-primary px-4">Submit</button>
        <button type="button" class="btn btn-outline-secondary px-4" onclick="window.location.href='{% url 'licenses:all' %}';">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
    const statusField = document.querySelector('#id_status');
    const warningAlert = document.querySelector('#id_status').closest('.card').querySelector('#status_warning_alert');
    const TARGET_VALUE = 'Inactive';

    if (statusField && warningAlert) {
        // Run once on page load in case the initial database state is already 'Inactive'
        if (statusField.value === TARGET_VALUE) {
            warningAlert.classList.remove('d-none');
        }

        // Listen for user changes on the select field
        statusField.addEventListener('change', (event) => {
            if (event.target.value === TARGET_VALUE) {
                // User picked Inactive: Reveal the alert banner smoothly
                warningAlert.classList.remove('d-none');
                document.getElementById("id_note").required = true;
            } else {
                // User picked anything else: Hide the banner
                warningAlert.classList.add('d-none');
            }
        });
    }
</script>
{% endblock %}
