{% extends "base_menu.html" %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="card border-danger shadow-sm">
        <div class="card-header bg-danger text-white py-3">
          <h5 class="card-title mb-0 d-flex align-items-center gap-2">
            <i class="fa fa-exclamation-triangle"></i> Delete Product Catalog Entry
          </h5>
        </div>

        <div class="card-body p-4">
          <p class="text-secondary mb-4">
            Are you absolutely sure you want to permanently delete this product? This process cannot be undone and may affect associated licenses.
          </p>

          <div class="bg-light rounded p-3 mb-4 border-start border-4 border-danger">
            <div>
              <small class="text-muted d-block text-uppercase fw-bold tracking-wider fs-7">Product Name</small>
              <span class="fw-semibold text-dark">{{ product.name }}</span>
            </div>
          </div>

          <form action="" method="post" id="delete_confirmation_form">
            {% csrf_token %}
            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-danger">
                <i class="fa fa-trash me-1"></i> Confirm Permanent Deletion
              </button>
              <button type="button" class="btn btn-outline-secondary" onclick="window.location.href='{% url 'products:product_detail' product.pk %}';">
                Cancel, Keep Record
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
